<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PermitGuard — Create Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161d2b; --paper:#f7f2e6; --paper-card:#fffdf8;
    --brass:#96702f; --brass-deep:#6e4f1f; --rule:#cbbfa0;
    --muted:#6f6858; --error:#7a2e22; --error-bg:#f6e9e5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background: radial-gradient(circle at 50% 0%, rgba(150,112,47,0.06), transparent 60%), var(--paper);
    color:var(--ink); font-family:'Source Serif 4', Georgia, serif;
    display:flex; align-items:center; justify-content:center; padding:40px 20px;
  }
  .letterhead{width:100%; max-width:400px;}
  .seal{
    width:56px; height:56px; margin:0 auto 18px; border-radius:50%;
    border:1.5px solid var(--brass); outline:1px solid var(--brass); outline-offset:3px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Cormorant Garamond', serif; font-size:19px; letter-spacing:0.04em; color:var(--brass-deep);
  }
  .wordmark{
    text-align:center; font-family:'Cormorant Garamond', serif; font-weight:600;
    font-size:34px; letter-spacing:0.03em; margin:0 0 4px; color:var(--ink);
  }
  .tagline{
    text-align:center; font-size:13px; letter-spacing:0.14em; color:var(--brass-deep);
    margin:0 0 28px; font-style:italic;
  }
  .card{
    background:var(--paper-card); border:1px solid var(--rule);
    padding:34px 30px 30px; position:relative;
  }
  .card::before{content:""; position:absolute; inset:6px; border:1px solid var(--rule); pointer-events:none;}
  h1{
    font-family:'Cormorant Garamond', serif; font-weight:500; font-style:italic;
    font-size:23px; margin:0 0 6px; text-align:center;
  }
  p.sub{color:var(--muted); font-size:14.5px; line-height:1.55; text-align:center; margin:0 0 26px;}
  form{display:flex; flex-direction:column; gap:16px;}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px;}
  .field input{
    width:100%; padding:10px 2px; border:none; border-bottom:1px solid var(--rule);
    background:transparent; font-size:15.5px; font-family:'Source Serif 4', serif; color:var(--ink);
  }
  .field input:focus{outline:none; border-bottom:1px solid var(--brass);}
  button.submit{
    margin-top:10px; padding:13px; background:var(--ink); color:var(--paper);
    border:1px solid var(--ink); font-size:15px; letter-spacing:0.03em; cursor:pointer;
  }
  button.submit:hover{background:var(--paper); color:var(--ink);}
  .msg{margin-top:18px; font-size:13.5px; padding:10px 12px; display:none;}
  .msg.error{display:block; background:var(--error-bg); color:var(--error);}
  .footer-rule{text-align:center; font-size:11px; letter-spacing:0.12em; color:var(--rule); margin-top:22px;}
</style>
</head>
<body>

<div class="letterhead">
  <div class="seal">PG</div>
  <div class="wordmark">PermitGuard</div>
  <div class="tagline">Compliance, Kept in Order</div>

  <div class="card">
    <h1>Name your workspace</h1>
    <p class="sub">This is the company or team your permits and projects will belong to.</p>

    <form id="companyForm">
      <div class="field">
        <label>Company name</label>
        <input type="text" id="companyName" placeholder="e.g. Vidojay Holdings" required>
      </div>
      <button type="submit" class="submit">Create workspace</button>
    </form>

    <div id="msg" class="msg"></div>
  </div>

  <div class="footer-rule">EST. PERMITGUARD REGISTRY</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://ocaupscyktxnvjxohuro.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jYXVwc2N5a3R4bnZqeG9odXJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NjUxNjUsImV4cCI6MjEwNjA0MTE2NX0.ts2-U8Iyauj4T3qDlgoLD20HnregnMnU0M2_1oKZdvo";

  const msg = document.getElementById('msg');
  function showError(text){ msg.textContent = text; msg.className = 'msg error'; }

  let sb;
  try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
  catch(e){ showError('Could not connect. Open this page on its live hosted link.'); }

  // Guard: must be logged in
  (async () => {
    if (!sb) return;
    const { data: { session } } = await sb.auth.getSession();
    if (!session){
      window.location.href = 'index.html';
      return;
    }
    // If they already have a company, skip straight to the dashboard
    const { data: profile } = await sb
      .from('profiles')
      .select('company_id')
      .eq('id', session.user.id)
      .single();

    if (profile && profile.company_id){
      window.location.href = 'dashboard.html';
    }
  })();

  document.getElementById('companyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!sb){ showError('Not connected. Open this page on its live hosted link.'); return; }

    const name = document.getElementById('companyName').value.trim();
    const { data: { session } } = await sb.auth.getSession();
    if (!session){ window.location.href = 'index.html'; return; }

    const newCompanyId = crypto.randomUUID();

    const { error: companyError } = await sb
      .from('companies')
      .insert({ id: newCompanyId, name });

    if (companyError){ showError(companyError.message); return; }

    const { error: profileError } = await sb
      .from('profiles')
      .update({ company_id: newCompanyId })
      .eq('id', session.user.id);

    if (profileError){ showError(profileError.message); return; }

    window.location.href = 'dashboard.html';
  });
</script>

</body>
</html>
