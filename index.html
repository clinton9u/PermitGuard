<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PermitGuard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161d2b;
    --paper:#f7f2e6;
    --paper-card:#fffdf8;
    --brass:#96702f;
    --brass-deep:#6e4f1f;
    --rule:#cbbfa0;
    --muted:#6f6858;
    --error:#7a2e22;
    --error-bg:#f6e9e5;
    --ok:#33533a;
    --ok-bg:#e9f0e6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, rgba(150,112,47,0.06), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
  }

  .letterhead{
    width:100%;
    max-width:400px;
  }

  .seal{
    width:56px;
    height:56px;
    margin:0 auto 18px;
    border-radius:50%;
    border:1.5px solid var(--brass);
    outline:1px solid var(--brass);
    outline-offset:3px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cormorant Garamond', serif;
    font-size:19px;
    letter-spacing:0.04em;
    color:var(--brass-deep);
  }

  .wordmark{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:34px;
    letter-spacing:0.03em;
    margin:0 0 4px;
    color:var(--ink);
  }

  .tagline{
    text-align:center;
    font-size:13px;
    letter-spacing:0.14em;
    color:var(--brass-deep);
    margin:0 0 28px;
    font-family:'Source Serif 4', serif;
    font-style:italic;
  }

  .card{
    background:var(--paper-card);
    border:1px solid var(--rule);
    padding:34px 30px 30px;
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid var(--rule);
    pointer-events:none;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-style:italic;
    font-size:23px;
    margin:0 0 6px;
    text-align:center;
    color:var(--ink);
  }
  p.sub{
    color:var(--muted);
    font-size:14.5px;
    line-height:1.55;
    text-align:center;
    margin:0 0 26px;
  }

  .tabs{
    display:flex;
    justify-content:center;
    gap:28px;
    border-bottom:1px solid var(--rule);
    margin-bottom:26px;
    padding-bottom:12px;
  }
  .tab{
    background:none;
    border:none;
    font-family:'Source Serif 4', serif;
    font-size:15px;
    color:var(--muted);
    cursor:pointer;
    padding:0 0 4px;
    position:relative;
  }
  .tab.active{color:var(--ink);}
  .tab.active::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-13px;
    height:1px;
    background:var(--brass);
  }

  form{display:none;flex-direction:column;gap:16px;}
  form.active{display:flex;}

  .field label{
    display:block;
    font-size:12.5px;
    letter-spacing:0.03em;
    color:var(--muted);
    margin-bottom:5px;
    font-family:'Source Serif 4', serif;
  }
  .field input{
    width:100%;
    padding:10px 2px;
    border:none;
    border-bottom:1px solid var(--rule);
    background:transparent;
    font-size:15.5px;
    font-family:'Source Serif 4', serif;
    color:var(--ink);
  }
  .field input:focus{
    outline:none;
    border-bottom:1px solid var(--brass);
  }

  button.submit{
    margin-top:10px;
    padding:13px;
    background:var(--ink);
    color:var(--paper);
    border:1px solid var(--ink);
    font-family:'Source Serif 4', serif;
    font-size:15px;
    letter-spacing:0.03em;
    cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease;
  }
  button.submit:hover{
    background:var(--paper);
    color:var(--ink);
  }

  .msg{
    margin-top:18px;
    font-size:13.5px;
    line-height:1.5;
    padding:10px 12px;
    display:none;
    font-family:'Source Serif 4', serif;
  }
  .msg.error{display:block;background:var(--error-bg);color:var(--error);}
  .msg.ok{display:block;background:var(--ok-bg);color:var(--ok);}

  .signed-in{display:none;text-align:center;}
  .signed-in.active{display:block;}
  .signed-in .email{
    color:var(--brass-deep);
    word-break:break-all;
    font-size:15px;
    margin:6px 0 22px;
  }
  .signed-in button{
    padding:10px 22px;
    background:none;
    border:1px solid var(--ink);
    color:var(--ink);
    font-family:'Source Serif 4', serif;
    cursor:pointer;
  }
  .signed-in button:hover{
    background:var(--ink);
    color:var(--paper);
  }

  .footer-rule{
    text-align:center;
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--rule);
    margin-top:22px;
  }
</style>
</head>
<body>

<div class="letterhead">
  <div class="seal">PG</div>
  <div class="wordmark">PermitGuard</div>
  <div class="tagline">Compliance, Kept in Order</div>

  <div class="card">
    <div id="authView">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to your workspace, or register a new one below.</p>

      <div class="tabs">
        <button class="tab active" data-tab="login">Sign in</button>
        <button class="tab" data-tab="signup">Register</button>
      </div>

      <form id="loginForm" class="active">
        <div class="field">
          <label>Email address</label>
          <input type="email" id="loginEmail" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="loginPassword" required>
        </div>
        <button type="submit" class="submit">Sign in</button>
      </form>

      <form id="signupForm">
        <div class="field">
          <label>Full name</label>
          <input type="text" id="signupName" required>
        </div>
        <div class="field">
          <label>Email address</label>
          <input type="email" id="signupEmail" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="signupPassword" required minlength="6">
        </div>
        <button type="submit" class="submit">Create account</button>
      </form>

      <div id="msg" class="msg"></div>
    </div>

    <div id="signedInView" class="signed-in">
      <h1>You're signed in</h1>
      <p class="sub" style="margin-bottom:4px;">Registered as</p>
      <div class="email" id="userEmail"></div>
      <button id="logoutBtn">Sign out</button>
    </div>
  </div>

  <div class="footer-rule">EST. PERMITGUARD REGISTRY</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://ocaupscyktxnvjxohuro.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jYXVwc2N5a3R4bnZqeG9odXJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NjUxNjUsImV4cCI6MjEwNjA0MTE2NX0.ts2-U8Iyauj4T3qDlgoLD20HnregnMnU0M2_1oKZdvo";

  const authView = document.getElementById('authView');
  const signedInView = document.getElementById('signedInView');
  const msg = document.getElementById('msg');
  const userEmail = document.getElementById('userEmail');

  function showMessage(text, type){
    msg.textContent = text;
    msg.className = 'msg ' + type;
  }

  function showSignedIn(email){
    authView.style.display = 'none';
    signedInView.classList.add('active');
    userEmail.textContent = email;
  }

  async function routeAfterAuth(userId, email){
    showSignedIn(email);
    if (!sb) return;
    const { data: profile } = await sb
      .from('profiles')
      .select('company_id')
      .eq('id', userId)
      .single();

    if (!profile || !profile.company_id){
      window.location.href = 'company.html';
    } else {
      window.location.href = 'dashboard.html';
    }
  }

  function showAuthForm(){
    authView.style.display = 'block';
    signedInView.classList.remove('active');
  }

  // Tab switching is bound first, independent of Supabase, so it always works
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('form').forEach(f => f.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
      msg.className = 'msg';
    });
  });

  let sb;
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (err) {
    showMessage('Could not connect to the server. This page needs to be opened on its live hosted link (not a preview) for sign-in to work.', 'error');
  }

  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('signupName').value;
    const email = document.getElementById('signupEmail').value;
    const password = document.getElementById('signupPassword').value;

    if (!sb){ showMessage('Not connected. Open this page on its live hosted link.', 'error'); return; }

    const { data, error } = await sb.auth.signUp({
      email,
      password,
      options: { data: { full_name: name } }
    });

    if (error){
      showMessage(error.message, 'error');
    } else if (data.user){
      showMessage('Account created.', 'ok');
      if (data.session){
        routeAfterAuth(data.user.id, data.user.email);
      }
    }
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;

    if (!sb){ showMessage('Not connected. Open this page on its live hosted link.', 'error'); return; }

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    if (error){
      showMessage(error.message, 'error');
    } else {
      routeAfterAuth(data.user.id, data.user.email);
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    if (!sb) return;
    await sb.auth.signOut();
    showAuthForm();
  });

  if (sb){
    sb.auth.getSession().then(({ data }) => {
      if (data.session){
        routeAfterAuth(data.session.user.id, data.session.user.email);
      }
    });
  }
</script>

</body>
</html>
